services:
  veiculos-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-veiculos_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - veiculos_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-veiculos.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  veiculos-api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VEICULOS_PORT: 3002
      DB_HOST: veiculos-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-veiculos_db}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${VEICULOS_PORT:-3002}:3002"
    depends_on:
      veiculos-db:
        condition: service_healthy

volumes:
  veiculos_mysql_data:
